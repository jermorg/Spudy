<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spudy — Setup</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/css/app.css">
</head>

<body class="bg-[#0d1117] text-gray-300 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-[#161b22] border border-gray-800 rounded-xl shadow-2xl p-6 md:p-8">
        <div class="text-center mb-6">
            <div
                class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-400 mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                </svg>
            </div>
            <h1 class="text-xl font-bold text-white tracking-tight">Welcome to Spudy</h1>
            <p class="text-xs text-gray-400 mt-1.5">Enter your Telegram Bot Token to initialize and launch the bridge.
            </p>
        </div>

        <form id="setup-form" class="space-y-4">
            <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-gray-400 mb-1.5">
                    Telegram Bot Token <span class="text-rose-500">*</span>
                </label>
                <input type="text" id="bot-token" required placeholder="1234567890:ABCdefGhIJKlmNoPQRsTUVwxyZ"
                    class="w-full bg-[#0d1117] border border-gray-800 rounded-lg px-3.5 py-2.5 text-xs font-mono text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500 transition-colors">
                <p class="text-[11px] text-gray-500 mt-1.5">
                    Create a bot via <a href="https://t.me/BotFather" target="_blank"
                        class="text-blue-400 hover:underline">@BotFather</a> and paste the token here.
                </p>
            </div>

            <button type="submit" id="setup-submit-btn"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs py-2.5 px-4 rounded-lg transition-all active:scale-95 cursor-pointer">
                Verify & Start Bot
            </button>
        </form>
    </div>

    <script type="module" src="/js/setup.js"></script>
</body>

</html>
