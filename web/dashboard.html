<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spudy — Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/css/app.css">
</head>

<body class="bg-[#0d1117] text-gray-400 font-sans antialiased min-h-screen">

    <nav class="flex items-center justify-between bg-[#0d1117] px-6 py-3 border-b border-gray-800 text-sm font-medium">
        <div class="flex items-center space-x-6">
            <a href="/" class="flex items-center space-x-2.5 text-white font-semibold">
                <img src="/img/logo.jpg" alt="Spudy" onerror="this.style.display='none'"
                    class="w-8 h-8 rounded-full object-cover border border-gray-800">
                <span>Spudy</span>
            </a>
            <ul class="flex items-center space-x-5 text-gray-400">
                <li><a href="/" class="text-white font-semibold">Dashboard</a></li>
                <li><a href="/settings" class="hover:text-gray-200 transition-colors">Settings</a></li>
            </ul>
        </div>

        <div id="bot-status-pill"
            class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full text-xs bg-[#161b22] border border-gray-800 text-gray-400">
            <span class="w-2 h-2 rounded-full bg-gray-600"></span>
            <span>Checking...</span>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <h2 class="text-lg font-semibold text-white tracking-tight">Recent Requests</h2>
                <div id="log-filters" class="inline-flex rounded-lg bg-[#161b22] p-0.5 border border-gray-800 text-xs">
                    <button data-filter="all"
                        class="filter-btn px-2.5 py-1 rounded-md bg-gray-800 text-white font-medium cursor-pointer transition-colors">All</button>
                    <button data-filter="success"
                        class="filter-btn px-2.5 py-1 rounded-md text-gray-400 hover:text-gray-200 cursor-pointer transition-colors">Success</button>
                    <button data-filter="error"
                        class="filter-btn px-2.5 py-1 rounded-md text-gray-400 hover:text-gray-200 cursor-pointer transition-colors">Errors</button>
                </div>
            </div>

            <div class="flex items-center gap-2.5">
                <label
                    class="inline-flex items-center gap-2 text-xs text-gray-400 bg-[#161b22] border border-gray-800 px-3 py-1.5 rounded-lg cursor-pointer select-none">
                    <input type="checkbox" id="auto-refresh-toggle" checked class="accent-blue-500 cursor-pointer">
                    <span>Auto (5s)</span>
                </label>

                <button id="refresh-logs-btn"
                    class="inline-flex items-center gap-1.5 text-xs bg-[#161b22] hover:bg-gray-800 text-gray-200 px-3 py-1.5 rounded-lg border border-gray-800 transition-colors cursor-pointer">
                    <svg id="refresh-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                    </svg>
                    <span>Refresh</span>
                </button>

                <button id="clear-logs-btn"
                    class="text-xs bg-[#161b22] hover:bg-rose-950/50 hover:border-rose-800/60 hover:text-rose-300 text-gray-400 px-3 py-1.5 rounded-lg border border-gray-800 transition-colors cursor-pointer">
                    Clear
                </button>
            </div>
        </div>

        <div class="w-full overflow-x-auto rounded-lg border border-gray-800 bg-[#161b22]">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr
                        class="border-b border-gray-800 bg-[#0d1117]/60 text-gray-400 font-medium text-xs uppercase tracking-wider">
                        <th class="p-3.5 w-48">User</th>
                        <th class="p-3.5 w-40">Webhook</th>
                        <th class="p-3.5">Payload</th>
                        <th class="p-3.5 w-40">Date</th>
                        <th class="p-3.5 w-24 text-center">Status</th>
                    </tr>
                </thead>
                <tbody id="logs-table-body" class="divide-y divide-gray-800/60 text-gray-300">
                    <tr>
                        <td colspan="5" class="p-8 text-center text-gray-500 text-xs">Loading logs...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <dialog id="log-detail-dialog"
        class="backdrop:bg-black/70 bg-[#161b22] border border-gray-800 rounded-xl p-6 shadow-2xl max-w-lg w-full text-gray-200 m-auto">
        <div class="flex items-center justify-between pb-3 border-b border-gray-800">
            <h3 class="text-sm font-semibold text-white">Request Details</h3>
            <button onclick="document.getElementById('log-detail-dialog').close()"
                class="text-gray-500 hover:text-white cursor-pointer text-sm">✕</button>
        </div>
        <div id="log-detail-content" class="py-4 space-y-3 text-xs"></div>
    </dialog>

    <script type="module" src="/js/dashboard.js"></script>
</body>

</html>
